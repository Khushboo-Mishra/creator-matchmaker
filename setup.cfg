[flake8]
# 79 is archaic for this codebase. 100 keeps logic readable.
max-line-length = 100
exclude = .venv,venv,.git,__pycache__,build,dist,docs,data

# Two kinds of exemption, both deliberate.
#
# 1. Content, not logic. These files carry model prompts, user-visible
#    report prose, operator messages and CSV fixtures. Rewrapping a prompt
#    changes the bytes sent to the model, which changes judgments and
#    invalidates saved checkpoints; rewrapping report text changes what a
#    reader sees. Line length is not enforced on that text.
#
# 2. Content-addressed files. migrate_checkpoint.COLLECTION_FILES pins a
#    sha256 of each file listed below under "pinned", so a checkpoint
#    recorded by a different implementation is never silently reused. A
#    cosmetic edit there breaks migration, so style is not enforced on
#    them. Editing one on purpose means updating its pinned hash.
per-file-ignores =
    # pinned (sha256 in src/migrate_checkpoint.py)
    src/config.py:E501,E302,E305
    src/discover.py:E501,E302,E305
    src/pull.py:E501,E302,E305
    src/score_ai.py:E501,E302,E305
    src/evaluation.py:E501,E302,E305
    src/metadata_evidence.py:E501,E302,E305
    src/judgment_contract.py:E501,E302,E305
    src/ranking.py:E501,E302,E305
    src/screening.py:E501,E302,E305
    # prompt text, report prose, operator messages, CSV fixtures
    src/providers.py:E501
    src/reports.py:E501
    src/trends.py:E501
    src/diagnose.py:E501
    src/matchmaker.py:E501
    src/pipeline.py:E501
    src/migrate_checkpoint.py:E501
    scripts/run_diagnostic.py:E501
    tests/test_evidence_and_trends.py:E501
    tests/test_trend_cutoff.py:E501
    tests/test_run_diagnostic.py:E501
